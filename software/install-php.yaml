version: '3'
tasks:
  install-php:
    desc: '安裝php 和 composer'
    status:
      - which php
      - which composer
    cmds:
      - curl -fsSL https://packages.sury.org/php/apt.gpg | sudo tee /etc/apt/trusted.gpg.d/php.gpg > /dev/null
      - echo "deb https://packages.sury.org/php/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/php.list
      - sudo apt update
      - sudo apt install -y php8.4-cli php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip
      - curl -fsSL https://getcomposer.org/composer-stable.phar -o /tmp/composer.phar
      - sudo mv /tmp/composer.phar /usr/local/bin/composer
      - sudo chmod +x /usr/local/bin/composer
